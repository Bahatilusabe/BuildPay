name: Build and release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            asset: dist/BuildPay-*.exe
          - name: Linux
            os: ubuntu-22.04
            script: dist:linux
            asset: dist/BuildPay-*.AppImage

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux AppImage dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BuildPay-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: BuildPay-*
          merge-multiple: true

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BuildPay ${{ github.ref_name }}
          body: |
            BuildPay desktop installers:
            - Windows: `.exe` installer
            - Linux: `.AppImage`

            The macOS Intel installer is also attached when available.
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
