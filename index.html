<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildPay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="loading-body">
    <main class="loading-screen" aria-label="Loading BuildPay">
      <div class="loading-grid" aria-hidden="true"></div>
      <div class="loading-orbit loading-orbit-one" aria-hidden="true"></div>
      <div class="loading-orbit loading-orbit-two" aria-hidden="true"></div>
      <div class="loading-core" aria-hidden="true">
        <div class="loading-spinner"></div>
        <div class="loading-core-dot"></div>
      </div>
      <div class="loading-copy">
        <span class="loading-kicker">BUILD<span class="loading-kicker-accent">PAY</span></span>
        <span class="loading-label">Initializing workspace</span>
      </div>
    </main>

    <script src="sidebar-manager.js"></script>
    <script src="app.js"></script>
  </body>
</html>
